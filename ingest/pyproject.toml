[project]
name = "nba-ingest"
version = "0.1.0"
description = "Ingest NBA player stats (balldontlie) and NBA news (RSS) into Elasticsearch"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch>=9.0.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
]

[project.scripts]
nba-ingest = "nba_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nba_ingest"]
